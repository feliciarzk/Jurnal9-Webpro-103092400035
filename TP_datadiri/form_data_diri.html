
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border: 1px solid #ddd;
        }

        h2 {
            font-size: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .hobi label {
            margin: 5px 0;
        }

        button {
            margin-top: 15px;
            padding: 9px 18px;
            background: #087bea;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Formulir Data Diri</h2>

    <form action="proses_data_diri.php" method="POST">

        <label>Nama Lengkap:</label>
        <input type="text" name="nama" required>

        <label>Tanggal Lahir:</label>
        <input type="date" name="tanggal_lahir" required>

        <label>Hobi:</label>

        <div class="hobi">
            <label>
                <input type="checkbox" name="hobi[]" value="Membaca">
                Membaca
            </label>

            <label>
                <input type="checkbox" name="hobi[]" value="Olahraga">
                Olahraga
            </label>

            <label>
                <input type="checkbox" name="hobi[]" value="Musik">
                Musik
            </label>

            <label>
                <input type="checkbox" name="hobi[]" value="Lainnya">
                Lainnya
            </label>
        </div>

        <button type="submit">Kirim</button>

    </form>
</div>

</body>
</html>
